[package]
name = "img-converter-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Image decoding, encoding and conversion engine for img-converter"

[dependencies]
img-converter-common = { path = "../img-converter-common" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "ico", "bmp", "tiff", "tga", "hdr", "exr"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
ravif = { version = "0.11", default-features = false }
imgref = "1.10"
rgb = "0.8"
kamadak-exif = "0.5"
rayon = { workspace = true }
resvg = "0.45"
pdf-writer = "0.15"
lopdf = "0.34"
windows = { version = "0.58", features = [
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Graphics_Imaging",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Imaging",
] }
